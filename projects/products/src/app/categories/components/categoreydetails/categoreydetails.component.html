<section class="category-details" *ngIf="categoryDetails?._id">
  <div class="details-card">

    <div class="image-box">
      <img [src]="categoryDetails.image" [alt]="categoryDetails.name" />
    </div>

    <div class="info-box">
      <h1 class="title">{{ categoryDetails.name }}</h1>

      <p class="description">
        Discover our exclusive collection of <strong>{{ categoryDetails.name }}</strong>.
        Each product is carefully selected to match style, elegance, and luxury.
      </p>

      <button class="explore-btn">
        Explore Products
      </button>
    </div>

  </div>
</section>
