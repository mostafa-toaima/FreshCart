<div class="modal-backdrop">
  <div class="modal-container">
    <button class="close-btn" (click)="closeModal()">×</button>

    <h3 class="modal-title">Forget Password</h3>

    <!-- Step 1: Enter Email -->
    <section *ngIf="step1">
      <form [formGroup]="forgotForm">
        <label for="email">Email:</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          class="form-control my-2"
          placeholder="Enter your email"
        />
        <button
          #btnForget
          type="button"
          class="main-btn w-100 mt-3"
          (click)="forgotPassword(btnForget)">
          Send Reset Code <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
        </button>
        <p *ngIf="userMsg" class="alert alert-danger mt-2">{{ userMsg }}</p>
      </form>
    </section>

    <!-- Step 2: Enter Reset Code -->
    <section *ngIf="step2">
      <form [formGroup]="resetCode">
        <label for="resetCode">Reset Code:</label>
        <input
          formControlName="resetCode"
          type="text"
          id="resetCode"
          class="form-control my-2"
          placeholder="Enter reset code"
        />
        <button
          #btnReset
          type="button"
          class="main-btn w-100 mt-3"
          (click)="resetPasswordCode(btnReset)">
          Verify Code <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
        </button>
        <p *ngIf="userMsg" class="alert alert-danger mt-2">{{ userMsg }}</p>
      </form>
    </section>

    <!-- Step 3: New Password -->
    <section *ngIf="step3">
      <form [formGroup]="resetPassword">
        <label for="resetPassword">New Password:</label>
        <input
          formControlName="newPassword"
          type="password"
          id="resetPassword"
          class="form-control my-2"
          placeholder="Enter new password"
        />
        <button
          #btnNew
          type="button"
          class="main-btn w-100 mt-3"
          (click)="newPassword(btnNew)">
          Reset Password <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
        </button>
        <p *ngIf="userMsg" class="alert alert-danger mt-2">{{ userMsg }}</p>
      </form>
    </section>
  </div>
</div>
